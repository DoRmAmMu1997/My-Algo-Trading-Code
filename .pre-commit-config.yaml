# Local commit-time checks (mirrors the Streamlit Scanner App policy).
#
# Install once with:  pre-commit install
# Run on demand with: pre-commit run --all-files
#
# Policy: hooks here only CHECK, never rewrite files. Auto-fixers are run
# deliberately (`ruff check --fix`) so a commit never changes content the
# author didn't review. CI remains the authoritative gate; these hooks just
# catch the obvious failures before a push.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev aligned with the ruff pin in requirements.txt: the hook
    # is only useful if it enforces the SAME ruleset the CI gate will. This
    # drifted to v0.15.1 against a 0.16.2 pin, which is worse than having no
    # hook -- a commit could pass locally and still fail `Run Ruff static
    # checks`. `test_precommit_ruff_rev_matches_the_requirements_dev_pin` now
    # fails the build if the two separate again, so bump BOTH together.
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff check (no fixes)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    # v6.0.0 is current upstream as of 2026-08-17; no drift here.
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: debug-statements
