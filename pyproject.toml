# First-adoption strictness (Scanner App parity): check function bodies
# everywhere without yet requiring annotations on every def. Stricter flags
# (disallow_untyped_defs) and tests/ coverage are deliberate follow-ups.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type stubs, optional broker/ML SDKs that
# are absent on CI, and the vendored NorenApi client. pandas is NOT listed:
# it is typed via pandas-stubs (pinned in requirements.txt so local and
# CI check against the exact same stubs).
module = [
    "dhanhq.*",
    "gspread.*",
    "dotenv.*",
    "pytz.*",
    "backtesting.*",
    "claude_agent_sdk.*",
    "openai_codex.*",
    "neo_api_client.*",
    "pyotp.*",
    "websocket.*",
    "sklearn.*",
    "talib.*",
    "NorenApi",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The vendored Shoonya SDK is third-party code; type-check our wrappers, not it.
module = ["NorenApi"]
ignore_errors = true

[tool.coverage.run]
# Measure branch exits as well as statements. ``thread`` matters because the
# master runner and several fault-injection tests execute safety paths in worker
# threads. Relative paths keep the JSON report identical on Windows and Linux.
branch = true
relative_files = true
concurrency = ["thread"]
source = ["."]
omit = [
    # Every suite now lives under Tests/ (mirroring the source tree). Both
    # patterns are listed because Coverage.py's `*` does not cross a path
    # separator: the first catches Tests/test_x.py, the second the nested
    # Tests/<Component>/... suites.
    "Tests/*",
    "Tests/**/*",
    "*/test_*.py",
    "*/tests/*",
    "Backtest Outputs/*",
    "My Backtest Files (For Reference)/*",
    "Dependencies/Shoonya API/NorenApi.py",
]

[tool.coverage.report]
# MAT-110 measured the branch-enabled runtime baseline (54.7%) before installing
# this gate. Coverage has grown well past it since, so the floor was raised -- a
# floor 14 points below actual stops nothing. Per-module 90%/80% budgets are
# enforced from coverage.json by the small policy script because Coverage.py has
# only one global fail-under setting.
#
# 70.0 is set against CI's 70.2% (2026-09-02), measured identically on five
# consecutive main runs -- this number is deterministic, not drifting, so the
# margin is small BY DESIGN rather than by luck. USE THE CI NUMBER, NOT A LOCAL
# ONE: a developer machine with the optional broker SDKs installed
# (neo_api_client, pyotp) runs 7 tests that CI's verify job skips and reads
# about 2 points high. CI installs core + dev + ai + codex-ai only, deliberately
# (Kotak's official tag pins older pandas/requests and cannot share the audited
# core environment), so the hosted number is the honest one.
#
# The margin at 70.0 is roughly 0.2pp, about 40 statements. That is deliberate
# pressure: a PR that adds materially untested code should go red. It is NOT an
# invitation to lower the floor when it does.
#
# Raising this is deliberate and one-way: only move it UP, and only after a CI
# run shows real headroom. Lowering it to make a red build pass defeats the gate
# -- fix the tests instead.
fail_under = 70.0
precision = 1
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
